<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>PH550 YouTube Player</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}
#screen {
    width: 100vw;
    height: 100vh;
    background: #000;
    position: relative;
}
/* 유튜브 영상 */
#videoBox {
    position: absolute;
    width: 50vw;
    aspect-ratio: 16 / 9;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    background: #000;
}
#youtube {
    width: 100%;
    height: 100%;
    border: 0;
}
/* 조작 패널 */
#control {
    position: fixed;
    left: 10px;
    bottom: 10px;
    padding: 12px;
    background: rgba(40,40,40,0.9);
    border-radius: 10px;
    color: white;
    font-family: Arial, sans-serif;
    z-index: 100;
    transition: opacity 0.3s ease;
}
#control.hidden {
    opacity: 0;
    pointer-events: none;
}
input {
    width: 280px;
    padding: 8px;
    font-size: 16px;
}
button {
    padding: 8px 12px;
    margin: 3px;
    font-size: 15px;
}
#sizes, #aligns {
    margin-top: 8px;
}
#clearBtn {
    background: #555;
    color: white;
    border: none;
    border-radius: 6px;
}
.active {
    outline: 2px solid #2b6cff;
}
#fsBtn {
    background: #2b6cff;
    color: white;
    border: none;
    border-radius: 6px;
}
#toggleTab {
    position: fixed;
    left: 10px;
    bottom: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(40,40,40,0.6);
    color: white;
    border: none;
    font-size: 18px;
    z-index: 101;
    display: none;
}
#toggleTab.show {
    display: block;
}
</style>
</head>
<body>
<div id="screen">
    <div id="videoBox">
        <iframe
            id="youtube"
            src=""
            allow="autoplay; encrypted-media; fullscreen"
            allowfullscreen>
        </iframe>
    </div>
</div>
<div id="control">
    <div>
        <input
            id="url"
            placeholder="유튜브 주소 (영상 또는 재생목록)">
        <button id="clearBtn" onclick="clearUrl()">지우기</button>
        <button onclick="playVideo()">재생</button>
        <button id="fsBtn" onclick="enterFullscreen()">전체화면</button>
    </div>
    <div id="sizes">
        크기:
        <button onclick="setSize(1)">100%</button>
        <button onclick="setSize(0.75)">75%</button>
        <button onclick="setSize(0.5)">50%</button>
        <button onclick="setSize(0.4)">40%</button>
        <button onclick="setSize(0.3)">30%</button>
    </div>
    <div id="aligns">
        위치:
        <button id="alignLeftBtn" onclick="setAlign('left')">좌측</button>
        <button id="alignCenterBtn" onclick="setAlign('center')">중앙</button>
        <button id="alignRightBtn" onclick="setAlign('right')">우측</button>
    </div>
    <div style="margin-top:6px; font-size:12px; opacity:0.7;">
        컨트롤 패널 숨기기 → 화면 아무 곳이나 길게(2초) 터치
    </div>
</div>
<button id="toggleTab" onclick="showControl()">☰</button>

<script>
// videoId, listId를 함께 뽑아냄 (둘 중 하나만 있어도 동작)
function parseYoutube(url) {
    try {
        let u = new URL(url);
        let videoId = null;
        let listId = u.searchParams.get("list"); // 재생목록 id (있으면 공통으로 추출)

        // youtu.be/xxxx
        if (u.hostname.includes("youtu.be")) {
            videoId = u.pathname.substring(1);
        }
        // youtube.com/watch?v=xxxx  또는  youtube.com/playlist?list=xxxx
        else if (u.hostname.includes("youtube.com")) {
            videoId = u.searchParams.get("v");
        }
        return { videoId, listId };
    } catch(e) {}
    return { videoId: null, listId: null };
}

function playVideo() {
    const url = document.getElementById("url").value;
    const { videoId, listId } = parseYoutube(url);

    if (!videoId && !listId) {
        alert("유튜브 주소를 확인해주세요.");
        return;
    }

    let src;
    if (videoId && listId) {
        // 특정 영상부터 시작해서 같은 재생목록을 이어서 재생
        src = "https://www.youtube.com/embed/" + videoId +
              "?list=" + listId + "&autoplay=1&rel=0";
    } else if (listId) {
        // 재생목록 주소만 입력한 경우 (youtube.com/playlist?list=...)
        src = "https://www.youtube.com/embed/videoseries" +
              "?list=" + listId + "&autoplay=1&rel=0";
    } else {
        // 영상 하나만 재생
        src = "https://www.youtube.com/embed/" + videoId +
              "?autoplay=1&rel=0";
    }

    document.getElementById("youtube").src = src;
    // 재생 버튼 클릭은 사용자 제스처이므로 여기서도 전체화면 시도
    enterFullscreen();
}

function clearUrl() {
    const input = document.getElementById("url");
    input.value = "";
    input.focus();
}

function setSize(ratio) {
    const video = document.getElementById("videoBox");
    video.style.width = (ratio * 100) + "vw";
}

// ---- 화면 정렬 (좌 / 중앙 / 우) ----
function setAlign(pos) {
    const video = document.getElementById("videoBox");
    video.style.left = "";
    video.style.right = "";
    video.style.transform = "";

    if (pos === "left") {
        video.style.left = "0";
    } else if (pos === "right") {
        video.style.right = "0";
    } else {
        video.style.left = "50%";
        video.style.transform = "translateX(-50%)";
    }

    document.getElementById("alignLeftBtn").classList.remove("active");
    document.getElementById("alignCenterBtn").classList.remove("active");
    document.getElementById("alignRightBtn").classList.remove("active");
    document.getElementById("align" + pos.charAt(0).toUpperCase() + pos.slice(1) + "Btn")
        .classList.add("active");
}

// 초기 상태: 중앙 정렬 활성 표시
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("alignCenterBtn").classList.add("active");
});

// ---- 전체화면(주소창/상태바 숨김) ----
function enterFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen
        || el.webkitRequestFullscreen   // iOS Safari / 구형 웹킷
        || el.msRequestFullscreen;      // 구형 엣지
    if (req) {
        req.call(el).catch(() => {
            // 일부 iOS Safari는 전체화면 API 자체를 지원하지 않음
            // → "홈 화면에 추가" 후 실행하면 주소창/상태바 없이 열림
        });
    }
    // 화면 꺼짐 방지 (지원 브라우저에 한함)
    if (navigator.wakeLock) {
        navigator.wakeLock.request("screen").catch(() => {});
    }
}

// ---- 컨트롤 패널 숨기기/보이기 (화면 길게 누르면 숨김) ----
let pressTimer = null;
document.getElementById("screen").addEventListener("touchstart", () => {
    pressTimer = setTimeout(hideControl, 2000);
});
document.getElementById("screen").addEventListener("touchend", () => {
    clearTimeout(pressTimer);
});
document.getElementById("screen").addEventListener("mousedown", () => {
    pressTimer = setTimeout(hideControl, 2000);
});
document.getElementById("screen").addEventListener("mouseup", () => {
    clearTimeout(pressTimer);
});

function hideControl() {
    document.getElementById("control").classList.add("hidden");
    document.getElementById("toggleTab").classList.add("show");
}
function showControl() {
    document.getElementById("control").classList.remove("hidden");
    document.getElementById("toggleTab").classList.remove("show");
}
</script>
</body>
</html>
