<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>박수빈 근무일정 뷰어</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: 'Pretendard', '맑은 고딕', Arial, sans-serif; 
      background: #f8fafc;
      margin: 0; 
      padding: 0; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .work-schedule-container {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      max-width: 420px;
      padding: 2.5rem 2rem 2rem 2rem;
      width: 100%;
      text-align: center;
    }
    .date-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .nav-btn {
      background: #f0f3fa;
      border: none;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.3rem;
      color: #64748b;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: #e2e8f0; }
    .today-label {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .work-info {
      margin: 2.5rem 0 1.2rem 0;
      font-size: 1.15rem;
      min-height: 2.6rem;
      color: #334155;
      font-weight: 500;
    }
    .pay-info {
      font-size: 1.08rem;
      color: #2563eb;  /* 진한 파랑 */
      font-weight: 700;
      margin-top: 0.35rem;
      min-height: 1.6rem;
      transition: color 0.15s;
    }
    .pay-amount {
      color: #d95353;  /* 초록 */
    }
    .show-all-btn {
      margin-top: 1rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 1rem;
      background: #0ea5e9;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .show-all-btn:hover { background: #0284c7; }
    .all-schedule-table {
      margin-top: 2rem;
      border-collapse: collapse;
      width: 100%;
      background: #f8fafc;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: none;
      font-size: 0.98rem;
    }
    .all-schedule-table th, .all-schedule-table td {
      padding: 0.7rem 0.3rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .all-schedule-table th {
      background: #f0f3fa;
      color: #2563eb;
    }
    .all-schedule-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <div class="work-schedule-container">
    <div class="date-nav">
      <button class="nav-btn" id="prevDay" title="전날">&larr;</button>
      <span class="today-label" id="todayLabel"></span>
      <button class="nav-btn" id="nextDay" title="다음날">&rarr;</button>
    </div>
    <div class="work-info" id="workInfo"></div>
    <div class="pay-info" id="payInfo"></div>
    <button class="show-all-btn" id="showAllBtn">전체 일정 보기</button>
    <table class="all-schedule-table" id="allScheduleTable">
      <thead>
        <tr>
          <th>날짜</th>
          <th>요일</th>
          <th>근무조</th>
          <th>근무시간</th>
        </tr>
      </thead>
      <tbody id="allScheduleBody">
      </tbody>
    </table>
  </div>
  <script>
    // 근무 일정(예시)

    const subinSchedule = {
  // 1주차
  "2025-07-07": "B",
  "2025-07-08": "휴무신청",
  "2025-07-09": "휴무신청",
  "2025-07-10": "B",
  "2025-07-11": "C",
  "2025-07-12": "B",
  "2025-07-13": "C",
  // 2주차
  "2025-07-14": "휴무",
  "2025-07-15": "A",
  "2025-07-16": "B(3시교육)",
  "2025-07-17": "B",
  "2025-07-18": "휴무",
  "2025-07-19": "A",
  "2025-07-20": "B",
  // 3주차
  "2025-07-21": "B",
  "2025-07-22": "B",
  "2025-07-23": "휴무",
  "2025-07-24": "휴무",
  "2025-07-25": "B",
  "2025-07-26": "B",
  "2025-07-27": "A",
  // 4주차 (여기서 추가!)
  "2025-07-28": "B",
  "2025-07-29": "B",
  "2025-07-30": "휴무",
  "2025-07-31": "A",
  "2025-08-01": "A",
  "2025-08-02": "휴무",
  "2025-08-03": "A"
    
"2025-08-04": "휴무",
  "2025-08-05": "B",
  "2025-08-06": "휴무",
  "2025-08-07": "B",
  "2025-08-08": "A",
  "2025-08-09": "B",
  "2025-08-10": "A"
};
    
    const workTimes = {
      "A": "09:00~17:00",
      "B": "13:30~21:30",
      "C": "12:00~20:00"
    };
    const workSec = {
      "A": [9,0,17,0],   // [시,분,시,분]
      "B": [13,30,21,30], // [시,분,시,분]
      "C": [12,0,20,0]
    };
    const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
    const HOURLY_WAGE = 10030;
    const SEC_WAGE = HOURLY_WAGE / 3600; // 초당 시급
    const START_DATE = "2025-07-07";

    function formatDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function getWeekday(dateObj) {
      return weekdays[dateObj.getDay()];
    }

    function getInitialDate() {
      return new Date();
    }

    let curDate = getInitialDate();
    let payTimer = null;

    function calcAccumSec(untilDate) {
      let totalSec = 0;
      const now = new Date();
      const todayStr = formatDate(now);
      let lastDate = new Date(untilDate);
      lastDate.setHours(23,59,59,999);

      Object.keys(subinSchedule).sort().forEach(dateStr => {
        if (dateStr < START_DATE || dateStr > formatDate(lastDate)) return;
        const type = subinSchedule[dateStr];
        if (!workSec[type]) return;
        if (dateStr < todayStr) {
          let [sh, sm, eh, em] = workSec[type];
          let daySec = ((eh*60+em)-(sh*60+sm))*60;
          totalSec += daySec;
        } else if (dateStr === todayStr) {
          let [sh, sm, eh, em] = workSec[type];
          let workStart = new Date(dateStr + "T" + String(sh).padStart(2, "0") + ":" + String(sm).padStart(2, "0") + ":00");
          let workEnd = new Date(dateStr + "T" + String(eh).padStart(2, "0") + ":" + String(em).padStart(2, "0") + ":00");
          if (now < workStart) return;
          let end = now > workEnd ? workEnd : now;
          let curSec = Math.floor((end - workStart)/1000);
          if (curSec > 0) totalSec += curSec;
        }
      });
      return totalSec;
    }

    function renderInfo(dateObj) {
      const dateStr = formatDate(dateObj);
      const yoil = getWeekday(dateObj);
      document.getElementById('todayLabel').innerText = `${dateStr} (${yoil})`;
      const workType = subinSchedule[dateStr];
      let info = "";
      if (!workType) {
        info = "근무일정 정보가 없습니다";
      } else if (workType === "휴무") {
        info = "박수빈님은 휴무입니다.";
      } else {
        info = `박수빈님의 근무시간은 <b>${workTimes[workType]}</b> 입니다.`;
      }
      document.getElementById('workInfo').innerHTML = info;
      renderPayInfo(dateObj);
    }

    function renderPayInfo(selectedDateObj) {
      if (payTimer) clearInterval(payTimer);
      function updatePay() {
        const now = new Date();
        let todayStr = formatDate(now);
        let selectStr = formatDate(selectedDateObj);

        if (selectStr > todayStr) {
          document.getElementById('payInfo').innerHTML = "미래 근무 급여는 계산되지 않습니다.";
          return;
        }
        let sec = calcAccumSec(selectedDateObj);
        let pay = Math.floor(sec * SEC_WAGE);
        document.getElementById('payInfo').innerHTML =
          `2025년 7월 7일부터 누적 급여 : <b class="pay-amount">${pay.toLocaleString()}원</b>`;
      }
      updatePay();
      payTimer = setInterval(updatePay, 1000);
    }

    document.getElementById('prevDay').onclick = function() {
      curDate.setDate(curDate.getDate() - 1);
      renderInfo(curDate);
    };
    document.getElementById('nextDay').onclick = function() {
      curDate.setDate(curDate.getDate() + 1);
      renderInfo(curDate);
    };

    document.getElementById('showAllBtn').onclick = function() {
      const table = document.getElementById('allScheduleTable');
      if (table.style.display === "table") {
        table.style.display = "none";
        this.innerText = "전체 일정 보기";
      } else {
        table.style.display = "table";
        this.innerText = "닫기";
      }
    };

    function renderAllSchedule() {
      const body = document.getElementById('allScheduleBody');
      body.innerHTML = "";
      Object.keys(subinSchedule).sort().forEach(dateStr => {
        const dateObj = new Date(dateStr);
        const yoil = getWeekday(dateObj);
        const workType = subinSchedule[dateStr];
        let time = "";
        if (!workType) time = "-";
        else if (workType === "휴무") time = "휴무";
        else time = workTimes[workType];
        body.innerHTML += `
          <tr>
            <td>${dateStr}</td>
            <td>${yoil}</td>
            <td>${workType}</td>
            <td>${time}</td>
          </tr>
        `;
      });
    }

    renderInfo(curDate);
    renderAllSchedule();
  </script>
</body>
</html>
