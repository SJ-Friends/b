<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>VND → KRW</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px 16px;
    margin: 0 auto;
  }

  .card {
    padding: 22px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  h1 {
    margin: 0 0 10px;
    font-size: 22px;
    text-align: center;
  }

  .rate {
    font-size: 13px;
    text-align: center;
    opacity: 0.7;
    margin-bottom: 14px;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  /* 🔧 입력란 세로 높이 축소 (2/3) */
  input {
    flex: 1;
    padding: 10px 14px;   /* 기존 16px → 축소 */
    font-size: 22px;
    border-radius: 12px;
    border: none;
    outline: none;
    text-align: right;
  }

  .btn {
    width: 160px;
    font-size: 20px;
    border-radius: 12px;
    border: none;
    font-weight: bold;
  }

  .btn.plus { background: #4CAF50; color: #fff; }
  .btn.clear { background: #f44336; color: #fff; }

  .expression {
    margin-top: 10px;
    font-size: 18px;
    text-align: center;
    color: #ffeb3b;
    min-height: 22px;
  }

  /* 🔧 합산 금액 영역 여백 정리 */
  .result {
    margin-top: 14px;
    font-size: 24px;
    text-align: center;
    font-weight: bold;
    line-height: 1.2;
  }

  .korean {
    margin-top: 2px;      /* 기존 여백 제거 */
    font-size: 16px;
    text-align: center;
    opacity: 0.85;
    line-height: 1.2;
  }
</style>
</head>

<body>

<div class="container">
  <div class="card" id="card">
    <h1>🇻🇳 VND → 🇰🇷 KRW</h1>
    <div class="rate" id="rate">환율 불러오는 중...</div>

    <div class="input-row">
      <input id="vndInput" type="text" inputmode="numeric" placeholder="VND 입력" />
      <button class="btn plus" id="plusBtn">+</button>
      <button class="btn clear" id="clearBtn">C</button>
    </div>

    <div class="expression" id="expression"></div>

    <div class="result" id="result">0원</div>
    <div class="korean" id="korean">영원</div>
  </div>
</div>

<script>
let exchangeRate = 0;
let totalVnd = 0;
let displayTerms = [];
let showingTotal = false;

const input = document.getElementById("vndInput");
const result = document.getElementById("result");
const korean = document.getElementById("korean");
const expression = document.getElementById("expression");
const card = document.getElementById("card");

// 환율
async function loadRate() {
  const res = await fetch("https://open.er-api.com/v6/latest/VND");
  const data = await res.json();
  exchangeRate = data.rates.KRW;
  document.getElementById("rate").innerText =
    `현재 환율: 1 VND = ${exchangeRate.toFixed(4)} 원`;
}
loadRate();

// 숫자 → 한글
function numberToKorean(num) {
  if (num === 0) return "영원";
  num = Math.floor(num / 100) * 100;

  const big = ["", "만", "억", "조"];
  const small = ["", "십", "백", "천"];
  const n = ["영", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];

  let out = [];
  let i = 0;

  while (num > 0) {
    const chunk = num % 10000;
    if (chunk) {
      let parts = [];
      let t = chunk;
      for (let j = 0; j < 4; j++) {
        const d = t % 10;
        if (d) parts.unshift((d === 1 && j ? small[j] : n[d] + small[j]));
        t = Math.floor(t / 10);
      }
      let text = parts.join(" ");
      if (text === "일" && i > 0) text = "";
      out.unshift((text + big[i]).trim());
    }
    num = Math.floor(num / 10000);
    i++;
  }
  return out.join(" ") + "원";
}

// 원화 표시
function updateKRW(vnd) {
  if (!vnd || !exchangeRate) {
    result.innerText = "0원";
    korean.innerText = "영원";
    return;
  }
  const won = Math.floor(vnd * exchangeRate);
  result.innerText = `${won.toLocaleString()}원`;
  korean.innerText = numberToKorean(won);
}

// 입력 처리
input.addEventListener("click", e => e.stopPropagation());
input.addEventListener("input", e => {
  e.stopPropagation();
  const raw = input.value.replace(/,/g, "");
  if (!raw || isNaN(raw)) {
    updateKRW(0);
    return;
  }

  input.value = Number(raw).toLocaleString();
  showingTotal = false;
  updateKRW(Number(raw));
});

// 누적
plusBtn.addEventListener("click", e => {
  e.stopPropagation();
  const raw = Number(input.value.replace(/,/g, ""));
  if (!raw) return;

  totalVnd += raw;
  displayTerms.push(Math.floor(raw / 1000));
  expression.innerText = displayTerms.join(" + ");

  input.value = "";
  showingTotal = true;
  updateKRW(totalVnd);
  input.focus();
});

// 초기화
clearBtn.addEventListener("click", e => {
  e.stopPropagation();
  totalVnd = 0;
  displayTerms = [];
  expression.innerText = "";
  input.value = "";
  showingTotal = false;
  updateKRW(0);
  input.focus();
});

// 입력 외 클릭 → ×1000
card.addEventListener("click", () => {
  const raw = Number(input.value.replace(/,/g, ""));
  if (!raw) return;

  const multiplied = raw * 1000;
  input.value = multiplied.toLocaleString();
  showingTotal = false;
  updateKRW(multiplied);
  input.focus();
});

window.onload = () => input.focus();
</script>

</body>
</html>
