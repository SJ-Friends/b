<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>VND → KRW</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px 16px 0;
  }

  .card {
    padding: 24px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    text-align: center;
  }

  .rate {
    font-size: 13px;
    text-align: center;
    opacity: 0.7;
    margin-bottom: 14px;
  }

  input {
    width: 100%;
    padding: 16px;
    font-size: 22px;
    border-radius: 14px;
    border: none;
    outline: none;
    text-align: right;
  }

  .result {
    margin-top: 18px;
    font-size: 24px;
    text-align: center;
    font-weight: bold;
  }

  .korean {
    margin-top: 6px;
    font-size: 16px;
    text-align: center;
    opacity: 0.85;
  }

  .hint {
    margin-top: 12px;
    font-size: 12px;
    text-align: center;
    opacity: 0.6;
  }

  .multiply-zone {
    flex: 1;
    width: 100%;
  }
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>🇻🇳 VND → 🇰🇷 KRW</h1>
    <div class="rate" id="rate">환율 불러오는 중...</div>

    <input
      id="vndInput"
      type="text"
      inputmode="numeric"
      placeholder="VND 입력 (터치 시 초기화)"
    />

    <div class="result" id="result">0원</div>
    <div class="korean" id="korean">영원</div>
    <div class="hint">입력창 터치: 초기화 · 아래 화면 터치: ×1000</div>
  </div>
</div>

<div class="multiply-zone" id="multiplyZone"></div>

<audio id="clickSound" preload="auto">
  <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg">
</audio>

<script>
let exchangeRate = 0;

const input = document.getElementById("vndInput");
const result = document.getElementById("result");
const korean = document.getElementById("korean");

// 📡 환율
async function loadRate() {
  const res = await fetch("https://open.er-api.com/v6/latest/VND");
  const data = await res.json();
  exchangeRate = data.rates.KRW;
  document.getElementById("rate").innerText =
    `현재 환율: 1 VND = ${exchangeRate.toFixed(4)} 원`;
}
loadRate();

// 🔢 숫자 → 한글
function numberToKorean(num) {
  if (num === 0) return "영원";
  num = Math.floor(num / 100) * 100;

  const big = ["", "만", "억", "조"];
  const small = ["", "십", "백", "천"];
  const n = ["영", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];

  let out = [];
  let i = 0;

  while (num > 0) {
    const chunk = num % 10000;
    if (chunk) {
      let parts = [];
      let t = chunk;
      for (let j = 0; j < 4; j++) {
        const d = t % 10;
        if (d) parts.unshift((d === 1 && j ? small[j] : n[d] + small[j]));
        t = Math.floor(t / 10);
      }
      let text = parts.join(" ");
      if (text === "일" && i > 0) text = "";
      out.unshift((text + big[i]).trim());
    }
    num = Math.floor(num / 10000);
    i++;
  }
  return out.join(" ") + "원";
}

// 🧮 계산
function calculate(vnd) {
  if (!vnd || !exchangeRate) {
    result.innerText = "0원";
    korean.innerText = "영원";
    return;
  }
  const won = Math.floor(vnd * exchangeRate);
  result.innerText = `${won.toLocaleString()}원`;
  korean.innerText = numberToKorean(won);
}

// 🔊📳
function feedback() {
  if (navigator.vibrate) navigator.vibrate(30);
  const s = document.getElementById("clickSound");
  s.currentTime = 0;
  s.play().catch(() => {});
}

// ✅ 입력창 클릭 = 초기화 (유일한 초기화 트리거)
input.addEventListener("click", () => {
  input.value = "";
  calculate(0);
});

// 🔢 입력 처리 + 콤마
input.addEventListener("input", () => {
  const pos = input.selectionStart;
  const raw = input.value.replace(/,/g, "");
  if (!raw || isNaN(raw)) {
    calculate(0);
    return;
  }

  const formatted = Number(raw).toLocaleString();
  input.value = formatted;
  calculate(Number(raw));

  const diff = formatted.length - raw.length;
  input.setSelectionRange(pos + diff, pos + diff);
});

// 🔽 ×1000 (절대 초기화 안 됨)
document.getElementById("multiplyZone").addEventListener("click", () => {
  const raw = Number(input.value.replace(/,/g, ""));
  if (!raw) return;

  feedback();

  const v = raw * 1000;
  input.value = v.toLocaleString();
  calculate(v);
  input.focus();
});

window.onload = () => input.focus();
</script>

</body>
</html>
