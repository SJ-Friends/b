<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EV 주행비 계산기 — GV60 기준</title>
<style>
  :root{
    --bg:#0b1324; --card:#111a33; --muted:#9fb0d1; --text:#e8efff; --acc:#7aa2ff; --good:#4ade80;
    --border:rgba(255,255,255,0.08);
  }
  body{margin:0; background:#0a1022; color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;}
  .wrap{max-width:920px; margin:32px auto; padding:16px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:0 6px 28px rgba(0,0,0,.22);}
  h1{font-size:24px; margin:0 0 8px;}
  .grid{display:grid; grid-template-columns:1fr; gap:14px}
  @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
  label{display:block; font-weight:600; margin:2px 0 6px;}
  .input{display:flex; border:1px solid var(--border); border-radius:14px; background:#0b1430; align-items:center; padding:10px 12px; gap:8px}
  .input input{flex:1; background:transparent; border:0; outline:0; color:var(--text); font-size:18px}
  .suffix{color:var(--muted); font-size:14px}
  .table{width:100%; border-collapse:collapse; margin-top:12px}
  .table th,.table td{padding:10px 8px; border-bottom:1px dashed var(--border); text-align:right}
  .table th{text-align:left; color:var(--muted);}
  .hl{color:var(--good); font-weight:800}
  .row{display:flex; justify-content:space-between; padding:10px 12px; border-bottom:1px dashed var(--border)}
  .row:last-child{border-bottom:0}
  .result{font-size:22px; font-weight:800}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>EV 주행비 계산기 <span style="font-size:14px;color:var(--muted)">GV60 기준</span></h1>
      <p>입력: <strong>거리</strong>, <strong>연비</strong>, <strong>단가</strong>. 결과: 예상 충전비.</p>

      <div class="grid">
        <div>
          <label for="distance">주행 거리</label>
          <div class="input"><input id="distance" type="number" min="0" step="0.1" value="5.1" oninput="calc()"><span class="suffix">km</span></div>
        </div>
        <div>
          <label for="eff">연비(효율)</label>
          <div class="input"><input id="eff" type="number" min="0.1" step="0.1" value="6.5" oninput="calc()"><span class="suffix">km/kWh</span></div>
        </div>
        <div>
          <label for="priceKwh">단가</label>
          <div class="input"><input id="priceKwh" type="number" min="0" step="0.1" value="295.9" oninput="calc()"><span class="suffix">원/kWh</span></div>
        </div>
        <div>
          <label for="pricePercent">1% 요금(관측치)</label>
          <div class="input"><input id="pricePercent" type="number" min="0" step="1" value="266" oninput="calc()"><span class="suffix">원</span></div>
        </div>
      </div>

      <table class="table" id="table">
        <thead>
          <tr><th>계산 방식</th><th>소비 전력</th><th>소비 %</th><th>예상 요금</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="row"><div>총 예상 주행비</div><div class="result" id="total">0 원</div></div>
    </div>
  </div>

<script>
const KWH_PER_PERCENT = 77.4 / 100; // 0.774 kWh/%

function fmt(n, d=0){ return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d}); }

function calc(){
  const dist = parseFloat(document.getElementById('distance').value||'0');
  const eff  = parseFloat(document.getElementById('eff').value||'1');
  const priceKwh = parseFloat(document.getElementById('priceKwh').value||'295.9');
  const pricePercent = parseFloat(document.getElementById('pricePercent').value||'266');
  const energy = dist / eff;
  const percent = energy / KWH_PER_PERCENT;

  const costA = energy * priceKwh;
  const costB = percent * pricePercent;

  const tbody = document.querySelector('#table tbody');
  tbody.innerHTML = '';
  addRow('kWh 단가 기준', energy, percent, costA);
  addRow('명목 팩 + 1%요금', energy, percent, costB);

  document.getElementById('total').textContent = fmt(costA,0)+' 원';
}

function addRow(name, energy, percent, cost){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td style="text-align:left">${name}</td>
    <td>${fmt(energy,2)} kWh</td>
    <td>${fmt(percent,1)} %</td>
    <td class="hl">${fmt(cost,0)} 원</td>`;
  document.querySelector('#table tbody').appendChild(tr);
}

calc();
</script>
</body>
</html>
